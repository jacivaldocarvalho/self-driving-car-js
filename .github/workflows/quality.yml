name: Quality checks

on:
  push:
    branches:
      - main
      - chore/educational-project-modernization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Run regression tests
        run: npm test
