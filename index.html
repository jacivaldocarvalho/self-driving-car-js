<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Self-Driving Car Simulation</title>
</head>

<body>

    <p id="storageStatus" role="status" aria-live="polite"></p>
    <main id="simulation" aria-label="Driving simulation">
        <canvas id="carContainer" aria-label="Road and cars"></canvas>
        <div id="verticalButtons">
            <button onclick="save()">Save network</button>
            <button onclick="discard()">Remove saved network</button>
        </div>

        <canvas id="networkContainer" aria-label="Leading car neural network"></canvas>
    </main>

    <script src="assets/js/visualizer.js"></script>
    <script src="assets/js/network.js"></script>
    <script src="assets/js/sensor.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/road.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/car.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
